[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-diagnostic-engine"
version = "0.5.0"
description = "Read-only Linux system diagnostics and snapshot comparison CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lde = "syscheck:main"

[tool.setuptools]
py-modules = ["constants", "diagnostic_rules", "syscheck"]
